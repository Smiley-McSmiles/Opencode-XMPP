[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opencode-xmpp"
dynamic = ["version"]
description = "Talk to your opencode agents from any XMPP client: OMEMO chats, group rooms, encrypted files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WOOSAH" }]
keywords = ["xmpp", "jabber", "opencode", "agent", "omemo", "bot"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "slixmpp>=1.17,<2",
    "slixmpp-omemo>=2.2",
    "aiohttp>=3.9",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "py-spy>=0.3"]

[tool.hatch.version]
path = "opencode_xmpp/__init__.py"

[project.scripts]
opencode-xmpp = "opencode_xmpp.__main__:main"

[project.urls]
Homepage = "https://github.com/Smiley-McSmiles/Opencode-XMPP"
Repository = "https://github.com/Smiley-McSmiles/Opencode-XMPP"
Issues = "https://github.com/Smiley-McSmiles/Opencode-XMPP/issues"

[tool.hatch.build.targets.wheel]
packages = ["opencode_xmpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
